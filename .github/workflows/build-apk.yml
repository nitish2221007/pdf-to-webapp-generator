name: Build Android Mobile App (APK)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Android APK
        working-directory: android
        run: |
          gradle assembleDebug --stacktrace --no-daemon

      - name: Prepare APK Output
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/PDF_to_HTML_Converter.apk
          ls -lh release-apk/

      - name: Upload APK as GitHub Action Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDF_to_HTML_Converter_Android_App
          path: release-apk/PDF_to_HTML_Converter.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "📱 PDF to HTML Converter App v1.0.${{ github.run_number }}"
          body: |
            ### 📱 Download Android Mobile App (APK)
            
            Download the Android APK directly onto your phone:
            - **[PDF_to_HTML_Converter.apk](https://github.com/${{ github.repository }}/releases/download/v1.0.${{ github.run_number }}/PDF_to_HTML_Converter.apk)**
            
            #### Features:
            - 📄 Upload any PDF book directly from phone storage.
            - 📖 Smooth vertical continuous reading in pure HTML & CSS.
            - 📥 1-Click download of standalone `.html` book files.
          files: release-apk/PDF_to_HTML_Converter.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
